[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "expelify"
version = "0.1.0"
description = "Local-first, portable workflow specifications for LLM harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["typer>=0.12,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
expelify = "expelify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/expelify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
